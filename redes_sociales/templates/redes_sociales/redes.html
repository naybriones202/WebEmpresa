{% extends 'core/base.html' %}

{% block title %}Redes sociales{% endblock %}

{% block content %}
<section class="page-section cta">
  <div class="container">
    <div class="row">
      <div class="col-xl-9 mx-auto">
        <div class="cta-innerv text-center rounded">
          <h2 class="section-heading mb-5">
            <span class="section-heading-upper">Conéctate con nosotros</span>
            <span class="section-heading-lower">Síguenos en redes</span>
          </h2>
          {% for red in redes_sociales %}
          <p class="mb-0 mbt">
            <a href="{{ red.link }}" class="link" target="_blank" rel="noopener">
              <span class="fa-stack fa-lg">
                <i class="fa fa-circle fa-stack-2x"></i>
                <i class="fa fa-{{ red.name|lower }} fa-stack-1x fa-inverse"></i>
              </span>
              {{ red.name }}
            </a>
          </p>
          {% empty %}
          <p class="mb-0">Aún no hay redes sociales registradas.</p>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
